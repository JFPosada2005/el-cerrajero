<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Cerrajero — Taller del Nivel 1</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/BodoniModa-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Jost-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tool="wire" data-key="1">
  <div class="game-shell">
    <header class="hud">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" focusable="false">
            <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.2"></circle>
            <path d="M20 8a8 8 0 0 0-4 14.9V32h8v-9.1A8 8 0 0 0 20 8z" fill="none" stroke="currentColor" stroke-width="1.4"></path>
            <circle cx="20" cy="16" r="2.6" fill="currentColor"></circle>
          </svg>
        </span>
        <span class="brand-name">El Cerrajero</span>
      </div>

      <div class="hud-contract">
        <span class="hud-eyebrow">Contrato 01</span>
        <span class="hud-title">La caja de seguridad</span>
        <span class="hud-phase">Reparar</span>
      </div>

      <div class="hud-right">
        <div class="progress" aria-label="Progreso: contrato 1 de 5">
          <span class="keyhole is-done" aria-hidden="true"></span>
          <span class="keyhole" aria-hidden="true"></span>
          <span class="keyhole" aria-hidden="true"></span>
          <span class="keyhole" aria-hidden="true"></span>
          <span class="keyhole" aria-hidden="true"></span>
        </div>
        <button class="sound-button" id="sound-button" type="button" aria-label="Activar sonido" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
            <path class="sound-wave" d="M16 9c1.2 1.5 1.2 4.5 0 6M19 6c2.6 3 2.6 9 0 12"></path>
            <path class="sound-slash" d="M16 9l5 6M21 9l-5 6"></path>
          </svg>
        </button>
        <span class="mockup-pill">Mockup</span>
      </div>
    </header>

    <main class="stage" id="stage" aria-label="Mesa de trabajo del taller">
      <img class="scene" src="assets/sprites/fondo-banco.jpg" alt="" aria-hidden="true" draggable="false" data-sprite="fondo-banco">
      <div class="stage-light" aria-hidden="true"></div>
      <img class="bench" src="assets/sprites/mesa-madera.svg" alt="" aria-hidden="true" draggable="false" data-sprite="mesa-madera">
      <img class="thief" id="thief" src="assets/sprites/ladron.png" alt="El ladrón observa desde la penumbra" draggable="false" data-sprite="ladron">

      <div class="table-objects" aria-label="Objetos sobre la mesa">
        <button class="table-object object-contract" type="button" data-overlay="contract" aria-haspopup="dialog" aria-label="Abrir el contrato">
          <img src="assets/sprites/contrato.png" alt="" draggable="false" data-sprite="contrato">
          <span class="object-caption">Contrato</span>
        </button>
        <button class="table-object object-hint" type="button" data-overlay="hint" aria-haspopup="dialog" aria-label="Abrir la pista">
          <img src="assets/sprites/nota-pista.png" alt="" draggable="false" data-sprite="nota-pista">
          <span class="object-caption">Pista</span>
        </button>
        <button class="table-object object-log" type="button" data-overlay="log" aria-haspopup="dialog" aria-label="Abrir la bitácora">
          <img src="assets/sprites/libreta.png" alt="" draggable="false" data-sprite="libreta">
          <span class="object-caption">Bitácora</span>
        </button>
      </div>

      <div class="mechanism-wrap" id="mechanism">
        <img class="plate-texture" src="assets/sprites/placa-textura.jpg" alt="" aria-hidden="true" draggable="false" data-sprite="placa-textura">
        <img class="plate-frame" src="assets/sprites/placa-marco.svg" alt="" aria-hidden="true" draggable="false" data-sprite="placa-marco">
        <span class="plate-label">Banco del Llano · Caja 01</span>
        <span class="plate-serial">N.º 0147</span>

        <svg class="wires" id="wires" viewBox="0 0 900 560" role="group" aria-label="Cables del mecanismo" tabindex="-1">
          <defs>
            <filter id="tag-shadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.7"/>
            </filter>
          </defs>

          <g id="wire-group" role="group" aria-label="Cables"></g>

          <g id="alarm-layer" aria-hidden="true">
            <path class="alarm-shadow" d="M80 500C280 520 600 520 800 500" fill="none"></path>
            <path class="alarm-bus" d="M80 500C280 520 600 520 800 500" fill="none"></path>
            <circle class="alarm-node" cx="300" cy="512" r="4"></circle>
            <circle class="alarm-node" cx="620" cy="512" r="4"></circle>
            <path class="missing-groove" d="M407 242Q455 266 503 248" fill="none"></path>
            <circle class="open-socket" cx="407" cy="242" r="4.5"></circle>
            <circle class="open-socket" cx="503" cy="248" r="4.5"></circle>
          </g>

          <g id="pulse-layer" aria-hidden="true"></g>
          <g id="preview-layer" aria-hidden="true"></g>
        </svg>

        <span class="plate-alarm-label">Alarma</span>

        <div class="part part-entry" data-part="entry" role="button" tabindex="0" aria-label="Entrada del mecanismo">
          <span class="part-aura" aria-hidden="true"></span>
          <img src="assets/sprites/bocallave-entrada.png" alt="" draggable="false" data-sprite="bocallave-entrada">
        </div>

        <div class="part part-gear part-gear-1" data-part="gear-1" role="button" tabindex="0" aria-label="Rueda de memoria I">
          <span class="part-aura" aria-hidden="true"></span>
          <img class="gear-sprite" src="assets/sprites/rueda-engranaje.png" alt="" draggable="false" data-sprite="rueda-engranaje">
          <span class="gear-numeral" aria-hidden="true">I</span>
        </div>

        <div class="part part-gear part-gear-2" data-part="gear-2" role="button" tabindex="0" aria-label="Rueda de memoria II">
          <span class="part-aura" aria-hidden="true"></span>
          <img class="gear-sprite" src="assets/sprites/rueda-engranaje.png" alt="" draggable="false" data-sprite="rueda-engranaje">
          <span class="gear-numeral" aria-hidden="true">II</span>
        </div>

        <div class="part part-lock" data-part="lock" role="button" tabindex="0" aria-label="Cerrojo de la caja">
          <span class="part-aura" aria-hidden="true"></span>
          <img class="lock-bolt" src="assets/sprites/perno.svg" alt="" draggable="false" data-sprite="perno">
          <img class="lock-body" src="assets/sprites/cilindro-cerradura.png" alt="" draggable="false" data-sprite="cilindro-cerradura">
          <span class="lock-led" aria-hidden="true"></span>
        </div>

        <button class="part part-bell" type="button" data-part="bell" aria-label="Campana de alarma">
          <img src="assets/sprites/campana-alarma.png" alt="" draggable="false" data-sprite="campana-alarma">
        </button>
      </div>

      <div class="tool-cursor" id="tool-cursor" hidden aria-hidden="true">
        <img id="tool-cursor-img" src="assets/sprites/carrete-cobre.png" alt="" draggable="false">
        <span class="cursor-dot"></span>
      </div>

      <p class="stage-hint" id="stage-hint">Elige una herramienta y pruébala sobre el mecanismo.</p>
    </main>

    <p class="mobile-scroll-note">Desliza el mecanismo para recorrerlo →</p>

    <footer class="inventory" id="inventory" aria-label="Inventario del cerrajero">
      <div class="inventory-keys">
        <span class="key-rail" aria-hidden="true"></span>
        <div class="key-row">
          <button class="inventory-item inventory-key is-active" type="button" data-tool="key" data-key="1" data-cursor="assets/sprites/llave-cursor.png" aria-label="Llave 1">
            <img src="assets/sprites/llave-1.png" alt="" draggable="false" data-sprite="llave-1">
            <span class="item-name">Llave 1</span>
          </button>
          <button class="inventory-item inventory-key" type="button" data-tool="key" data-key="2" data-cursor="assets/sprites/llave-cursor.png" aria-label="Llave 2">
            <img src="assets/sprites/llave-2.png" alt="" draggable="false" data-sprite="llave-2">
            <span class="item-name">Llave 2</span>
          </button>
          <button class="inventory-item inventory-key" type="button" data-tool="key" data-key="3" data-cursor="assets/sprites/llave-cursor.png" aria-label="Llave 3">
            <img src="assets/sprites/llave-3.png" alt="" draggable="false" data-sprite="llave-3">
            <span class="item-name">Llave 3</span>
          </button>
          <button class="inventory-item inventory-key" type="button" data-tool="key" data-key="4" data-cursor="assets/sprites/llave-cursor.png" aria-label="Llave 4">
            <img src="assets/sprites/llave-4.png" alt="" draggable="false" data-sprite="llave-4">
            <span class="item-name">Llave 4</span>
          </button>
        </div>
      </div>

      <div class="inventory-tools">
        <button class="inventory-item inventory-tool is-active" type="button" data-tool="wire" aria-label="Carrete de cobre">
          <img src="assets/sprites/carrete-cobre.png" alt="" draggable="false" data-sprite="carrete-cobre">
          <span class="item-name">Cable</span>
        </button>
        <button class="inventory-item inventory-tool" type="button" data-tool="scissors" aria-label="Tijeras">
          <img src="assets/sprites/tijeras.png" alt="" draggable="false" data-sprite="tijeras">
          <span class="item-name">Tijera</span>
        </button>
        <button class="inventory-item inventory-tool is-locked" type="button" data-tool="gear" aria-label="Engranaje, se desbloquea en el contrato 02" aria-disabled="true">
          <img src="assets/sprites/rueda-engranaje.png" alt="" draggable="false" data-sprite="rueda-engranaje">
          <span class="item-name">Engranaje · contrato 02</span>
          <span class="lock-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="8" rx="2"></rect><path d="M9 11V8a3 3 0 0 1 6 0v3"></path></svg>
          </span>
        </button>
      </div>

      <div class="inventory-actions">
        <button class="action-button" id="probe-button" type="button">Probar</button>
        <button class="action-button is-primary" id="assault-button" type="button">Ensayo</button>
      </div>
    </footer>

    <p class="mockup-note">Mockup · datos de ejemplo · sin lógica de juego</p>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-backdrop" data-close></div>
    <section class="dossier" id="dossier" role="dialog" aria-modal="true" aria-label="Documento">
      <button class="overlay-close" id="overlay-close" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <div id="dossier-content"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <template id="tpl-contract">
    <article class="paper paper-contract">
      <p class="paper-kicker">Contrato 01</p>
      <h2>Banco del Llano</h2>
      <p class="paper-rule">Abre solo con la secuencia <strong>1 · 2 · 3</strong>.</p>
      <p class="paper-note">Cualquier otra combinación deja la alarma encendida.</p>
      <div class="paper-foot"><span>Caja 01</span><span>N.º 0147</span></div>
      <div class="paper-seal" aria-hidden="true"></div>
      <div class="paper-stamp" aria-hidden="true">En reparación</div>
    </article>
  </template>

  <template id="tpl-hint">
    <article class="paper paper-hint">
      <p class="paper-kicker">Pista <span id="hint-index">1</span> de 2</p>
      <h2>Pista del taller</h2>
      <p class="paper-hint-text" id="hint-text">La caja no pide una llave larga: pide tres pasos en orden. Cada rueda debe recordar el suyo.</p>
      <button class="paper-button" id="next-hint" type="button">Siguiente pista</button>
    </article>
  </template>

  <template id="tpl-log">
    <article class="paper paper-log">
      <p class="paper-kicker">Bitácora</p>
      <h2>Notas del caso</h2>
      <ol class="log-list">
        <li class="is-info"><span>21:04</span><p>Llave 1-2-3: el pulso se detuvo en la rueda I. Sin marcas en el cerrojo.</p></li>
        <li class="is-bad"><span>21:05</span><p>Llave 2: el perno cedió y el ladrón salió por el cable Entrada → Cerrojo.</p></li>
        <li class="is-bad"><span>21:06</span><p>Llave 1-1: la alarma quedó armada. El segundo salto cayó al vacío.</p></li>
      </ol>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
