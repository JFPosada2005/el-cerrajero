<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" width="1800" height="1120">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a4522"/>
      <stop offset="0.28" stop-color="#3b2c15"/>
      <stop offset="0.58" stop-color="#4d3b1b"/>
      <stop offset="0.82" stop-color="#33270f"/>
      <stop offset="1" stop-color="#21180a"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cf6a" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#f0cf6a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffe9a8" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc92"/>
      <stop offset="0.45" stop-color="#c79a32"/>
      <stop offset="1" stop-color="#5c3f12"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#f0cf6a" stroke-opacity="0.045"/>
    </pattern>
    <pattern id="grain" width="24" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 2H24M0 6H16" stroke="#fff" stroke-opacity="0.018"/>
    </pattern>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity="0.62"/>
    </filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feOffset dy="8" result="o"/>
      <feComposite in="o" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="d"/>
      <feFlood flood-color="#000" flood-opacity="0.7"/>
      <feComposite in2="d" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="s"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="s"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="34" y="34" width="1732" height="1052" rx="44" fill="#120d07" opacity="0.9"/>
    <rect x="44" y="44" width="1712" height="1032" rx="38" fill="url(#plate)" stroke="#1b1207" stroke-width="6"/>
    <rect x="54" y="54" width="1692" height="1012" rx="32" fill="url(#grid)"/>
    <rect x="54" y="54" width="1692" height="1012" rx="32" fill="url(#grain)"/>
    <rect x="54" y="54" width="1692" height="1012" rx="32" fill="url(#light)"/>
    <rect x="54" y="54" width="1692" height="1012" rx="32" fill="none" stroke="url(#bevel)" stroke-width="5"/>
    <rect x="72" y="72" width="1656" height="976" rx="26" fill="none" stroke="#0b0804" stroke-width="3" opacity="0.8"/>
    <rect x="84" y="84" width="1632" height="952" rx="22" fill="none" stroke="#f0cf6a" stroke-width="1.5" opacity="0.16"/>

    <g fill="url(#brass)" stroke="#2b1c0b" stroke-width="3">
      <g transform="translate(96 96)">
        <circle r="16"/><path d="M-11 0H11" stroke="#3a2a12" stroke-width="3"/>
      </g>
      <g transform="translate(1704 96) rotate(42)">
        <circle r="16"/><path d="M-11 0H11" stroke="#3a2a12" stroke-width="3"/>
      </g>
      <g transform="translate(96 1024) rotate(-28)">
        <circle r="16"/><path d="M-11 0H11" stroke="#3a2a12" stroke-width="3"/>
      </g>
      <g transform="translate(1704 1024) rotate(14)">
        <circle r="16"/><path d="M-11 0H11" stroke="#3a2a12" stroke-width="3"/>
      </g>
    </g>

    <g transform="translate(900 112)">
      <rect x="-320" y="-38" width="640" height="76" rx="10" fill="#0a0d11" stroke="#6e5317" stroke-width="3" filter="url(#inner)"/>
      <rect x="-300" y="-24" width="600" height="48" rx="5" fill="none" stroke="#f0cf6a" stroke-width="1" opacity="0.2"/>
    </g>

    <g transform="translate(132 980)">
      <rect x="0" y="-26" width="360" height="52" rx="7" fill="#0a0d11" stroke="#4a3614" stroke-width="2" opacity="0.85"/>
      <rect x="14" y="-14" width="332" height="28" rx="4" fill="none" stroke="#f0cf6a" stroke-width="1" opacity="0.16"/>
    </g>

    <g fill="none" stroke="#f0cf6a" stroke-width="2" opacity="0.18">
      <path d="M130 130h120v18h-120zM130 130v60h18v-60z"/>
      <path d="M1670 130h-120v18h120zM1670 130v60h-18v-60z"/>
      <path d="M130 990h120v-18h-120zM130 990v-60h18v60z"/>
      <path d="M1670 990h-120v-18h120zM1670 990v-60h-18v60z"/>
    </g>

    <g stroke="#000" stroke-width="2" opacity="0.2">
      <path d="M420 260l80-36M1180 880l120-24M320 760l80 18M1420 320l60 40"/>
    </g>
    <g stroke="#f0cf6a" stroke-width="1.2" opacity="0.1">
      <path d="M500 300l60-20M1240 840l80 10M360 800l60 12M1480 360l40 30"/>
    </g>
  </g>
</svg>
